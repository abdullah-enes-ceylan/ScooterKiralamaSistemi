name: Java CI

on:
  push:
    branches:
      - main
      - phase-1
      - phase-2
      - phase-3
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile project
        run: javac -cp lib/*:src src/*.java -d out/

      - name: Run tests
        run: java -cp lib/*:src:out org.junit.runner.JUnitCore KiralamaSistemiTest StandartScooterTest ProScooterTest