name: Java CI

on:
  push:
    branches:
      - main
      - phase-1
      - phase-2
      - phase-3
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download JUnit 5
        run: |
          mkdir -p lib
          curl -L https://repo1.maven.org/maven2/org/junit/jupiter/junit-jupiter-api/5.10.0/junit-jupiter-api-5.10.0.jar -o lib/junit-jupiter-api.jar
          curl -L https://repo1.maven.org/maven2/org/junit/jupite