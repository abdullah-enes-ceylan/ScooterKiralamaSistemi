name: Java CI

on:
  push:
    branches:
      - main
      - phase-1
      - phase-2
      - phase-3
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download JUnit
        run: |
          mkdir -p lib
          curl -L https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o lib/junit.jar
          curl -L https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o lib/hamcrest.jar

      - name: Compile project
        run: javac -cp lib/*:src src/*.java -d out/

      - name: Run tests
        run: java -cp lib/*:out org.junit.runner.JUnitCore KiralamaSistemiTest StandartScooterTest ProScooterTest